services:
  n8n:
    image: n8nio/n8n:2.44.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    env_file: .env
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    volumes:
      - n8n_data:/home/node/.n8n
      # n8n only reads files under ~/.n8n-files by default
      - ./knowledge-base:/home/node/.n8n-files/knowledge-base:ro

volumes:
  n8n_data:
